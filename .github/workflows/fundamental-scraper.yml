name: IDX Fundamentals Scraper

# Deliberately separate from daily-update.yml: this pulls real quarterly financial statements
# for the watchlist, which only change once a quarter - it has no business running every day
# at 19:00 WIB. Manual trigger any time, plus a low-frequency cron so coverage stays current
# without anyone needing to remember to click "Run workflow".
#
# Originally this scraped IDX's own XBRL filings directly, but idx.co.id sits behind a
# Cloudflare challenge that blocked every request in testing - even from a real home network
# with cloudscraper solving the JS challenge, it never got past "Just a moment...". Real
# quarterly financials for .JK tickers are pulled from Yahoo Finance (yfinance) instead - the
# same underlying reported figures, reachable without fighting a WAF. Trade-off: only the last
# ~5-6 quarters of history are available (Yahoo's own limit), not a deep multi-year backfill.
on:
  workflow_dispatch: {}
  schedule:
    # 1st of every month, 03:00 UTC (10:00 WIB) - well clear of the daily 19:00 WIB update.
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scrapers/idx-fundamentals/requirements.txt

      - name: Fetch quarterly financials from Yahoo Finance
        working-directory: scrapers/idx-fundamentals
        run: python fetch_fundamentals.py --data-dir data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install

      - name: Build fundamentals-history.json for the dashboard
        run: node scripts/build-fundamentals-history.mjs

      - name: Commit updated fundamentals data
        # Retry with a rebase if another workflow (daily-update/recovery-watchdog) pushed to
        # docs/data/ first - a normal race between independent scheduled workflows, not a real
        # conflict (never --force, so nobody's commit gets silently dropped).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/fundamentals-history.json docs/data/fundamentals-status.json
          git diff --staged --quiet || git commit -m "Update IDX fundamentals history $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i/5) - fetching and rebasing before retry"
            git fetch origin
            git rebase origin/main
            sleep $((i * 5))
          done
          git push
