name: Scalping Live Scan

# Real intraday scan, every 5 minutes during trading hours (ROADMAP.md §3.4) - two-tier design
# (cheap Multi Quote screen of the full 250-ticker universe, deep order-book/tape-reading scan
# of the ~30 biggest movers) sized to fit comfortably inside the 200k call/month Zapi quota
# alongside the existing daily pipeline.
#
# Plus ONE pre-market prep run at 19:00 WIB the EVENING BEFORE each trading day (not right
# before the 09:00 open) - most securities let orders be submitted from ~20:00 WIB onward, so a
# same-morning run would land too close to that window. Same script, same real confluence
# signals (VWAP/EMA/RSI7/Order Book/Tape Reading) as the live scan - no separate "old daily"
# logic revived. Real intraday bars/trades for the NEXT day obviously don't exist yet, so that
# run naturally reuses the last real values scripts/scalping-scan.mjs already had cached from
# that day's own close (see isChartCycle's own "reuse cached if nothing fresh came back"
# fallback) rather than fabricating anything - scalping-scan.mjs tags the output with
# session_phase so the dashboard can label it "prep pra-bursa" instead of implying it's live.
# Days 0-4 (Sun-Thu) mirror daily-update.yml's own schedule: Sunday evening preps Monday,
# Thursday evening preps Friday - Friday evening is skipped (Saturday isn't a trading day).
on:
  schedule:
    - cron: "0 12 * * 0-4" # 19:00 WIB the evening before - one pre-market prep run
    - cron: "*/5 2-8 * * 1-5" # 09:00-15:55 WIB - live, every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run scalping scan
        run: node scripts/scalping-scan.mjs
        env:
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit updated data
        if: always()
        # Same retry-rebase pattern as the other workflows (ROADMAP.md/README "Ketahanan") -
        # this one runs far more often (every 5 min) so a push race against the other
        # workflows is more likely, not less, to happen on any given run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/scalping-live.json
          git diff --staged --quiet || git commit -m "Scalping scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i/5) - fetching and rebasing before retry"
            git fetch origin
            git rebase origin/main
            sleep $((i * 5))
          done
          git push
