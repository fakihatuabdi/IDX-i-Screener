name: Daily IHSG Update

on:
  schedule:
    # 19:00 WIB = 12:00 UTC, every day except Saturday. IDX doesn't trade on weekends, but
    # Sunday still runs deliberately: it produces Monday's prep report from Friday's real
    # closing data (the pipeline always reports the actual last-session date, so this is
    # never mislabeled as "Sunday's" data).
    - cron: "0 12 * * 0-5"
  workflow_dispatch: {} # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write # needed to commit the updated data file back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run pipeline (retries until real IDX data recovers, or a wait budget runs out)
        run: |
          max_attempts=10
          wait_seconds=300
          for attempt in $(seq 1 $max_attempts); do
            echo "Pipeline attempt $attempt of $max_attempts..."
            if node scripts/run-pipeline.mjs; then
              echo "Pipeline succeeded on attempt $attempt with real IDX data."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Attempt $attempt used fallback data (or failed outright) - waiting ${wait_seconds}s before retrying, in case the real source recovers..."
              sleep $wait_seconds
            fi
          done
          # Deliberately exit 0 even here: run-pipeline.mjs already wrote a valid dashboard
          # (real if some attempt got it, an honest fallback otherwise) - the "Commit updated
          # data" step below must still run so that output isn't stranded uncommitted. A
          # step exiting non-zero would make GitHub Actions skip every step after it by
          # default, which would silently throw away a perfectly good fallback run.
          echo "Still on fallback data after $max_attempts attempts (~45 min) - committing the last attempt's (valid, honest) output as-is."
          exit 0
        env:
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/track-record.json
          git diff --staged --quiet || git commit -m "Automated dashboard update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
