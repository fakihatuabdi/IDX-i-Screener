name: Daily IHSG Update

on:
  schedule:
    # 19:00 WIB = 12:00 UTC, every day except Saturday. IDX doesn't trade on weekends, but
    # Sunday still runs deliberately: it produces Monday's prep report from Friday's real
    # closing data (the pipeline always reports the actual last-session date, so this is
    # never mislabeled as "Sunday's" data).
    - cron: "0 12 * * 0-5"
  workflow_dispatch: {} # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write # needed to commit the updated data file back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run pipeline
        # A single attempt: each real API call inside the pipeline already retries itself up
        # to 3x with a short backoff (lib/pipeline.mjs withRetry), and IDX-sourced data
        # (index-summary/foreign-flow/broker-summary) already falls back to a real Pluang-
        # based substitute within this same run if the primary source is down - see
        # lib/pipeline.mjs's data_health tracking. No long sleep-and-retry loop here anymore
        # (that used to make a single run take up to ~45 minutes); ongoing recovery when
        # BOTH primary and the fallback are down is instead handled by the separate hourly
        # recovery-watchdog workflow, which only re-runs when needed. This step is allowed to
        # exit non-zero (visible as a failed step) when the run finished in a degraded state
        # - the "if: always()" on the next step guarantees the data still gets committed
        # regardless.
        run: node scripts/run-pipeline.mjs
        env:
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/track-record.json
          git diff --staged --quiet || git commit -m "Automated dashboard update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
